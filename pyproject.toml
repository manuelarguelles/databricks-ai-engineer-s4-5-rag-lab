[project]
name = "databricks-ai-engineer-s4-5-rag-lab"
version = "1.0.0"
description = "Laboratorio docente S4.5: RAG reproducible sobre 24 documentos y 70 preguntas"
requires-python = ">=3.11"
dependencies = [
  "PyMuPDF==1.27.2.3",
  "PyYAML>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

